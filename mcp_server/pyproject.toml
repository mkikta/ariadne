[project]
name = "mcp-server"
version = "0.1.0"
description = "Ariadne MCP server."
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=3.4.2",
    "ollama>=0.6.2",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "testcontainers>=4.14.2",
    "docker<7.2"
]
