services:
  mcp-server:
    build: mcp_server/
    container_name: mcp-server
    ports:
     - "8080:8080"
    environment:
     - CHROMA_HOST=chromadb
     - CHROMA_PORT=8000
     - DOCUMENT_COLLECTION=document
     - CHUNKS_COLLECTION=chunks
     - CUSTOM_INSTRUCTIONS=${CUSTOM_INSTRUCTIONS}
    depends_on:
     - chromadb
    restart: unless-stopped

  processing-server:
    build: processing/            
    container_name: processing-server
    ports:
      - "3000:3000"
    environment:
     - CHROMA_HOST=chromadb
     - CHROMA_PORT=8000
     - DOCUMENT_COLLECTION=document
     - CHUNKS_COLLECTION=chunks
     - OLLAMA_HOST=ollama
     - OLLAMA_PORT=11434
     - MODEL=${MODEL}
    depends_on:
      - chromadb
    restart: unless-stopped
  
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: chroma_server
    ports:
      - "8000:8000"
    volumes:
     - ./chromadb:/data
    depends_on:
     - ollama
    restart: unless-stopped

  ollama:
   build:
    context: llm/
    args:
     MODEL: ${MODEL:-qwen3-embedding:0.6b}
   container_name: ollama_server
   ports:
    - "11434:11434"
   volumes:
    - ./ollama/ollama:/root/.ollama
   environment:
    - MODEL=${MODEL:-qwen3-embedding:0.6b}
   restart: always
